name: Set CRM password

# One-off, manual helper to set (or create) a CRM user's password directly in
# the production database — for regaining admin access. Run from the Actions
# tab (or `gh workflow run "Set CRM password"`).
#
# Required repo secrets:
#   CRM_TARGET_DB_URL  - External connection string for yardharvest-db
#   CRM_ADMIN_PASSWORD - the new password to set (kept out of logs by masking)
#
# The password is passed via an env var sourced from a secret, so it never
# appears on a command line or in the run log. Delete both the workflow and the
# CRM_ADMIN_PASSWORD secret once you've logged in and changed your password.

on:
  workflow_dispatch:
    inputs:
      username:
        description: "CRM username to set the password for (created with role=admin if it doesn't exist)"
        type: string
        required: true
        default: admin

permissions:
  contents: read

jobs:
  set-password:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set CRM password
        env:
          DATABASE_URL: ${{ secrets.CRM_TARGET_DB_URL }}
          CRM_NEW_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          SECRET_KEY: crm-set-password-not-a-real-secret
          FLASK_APP: wsgi:app
        run: flask crm-set-password "${{ inputs.username }}"
