databases:
  - name: yardharvest-db
    plan: free
    databaseName: yardharvest

services:
  - type: cron
    name: yardharvest-trial-lifecycle
    runtime: python
    plan: free
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask garden-trial-lifecycle
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yardharvest-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FLASK_APP
        value: wsgi:app
      # Email — the cron sends trial-lifecycle emails via Zoho ZeptoMail.
      # Without the token, emails are logged-only.
      - key: ZEPTOMAIL_TOKEN
        sync: false
      # SMS — Twilio (the cron also sends trial-expiring/ended texts). Unset =
      # SMS is a no-op (logged only). All three are required to send.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # Sentry error tracking for the cron's trial-lifecycle job. Unset = disabled.
      - key: SENTRY_DSN
        sync: false

  # Publishes scheduled CRM Facebook posts at their set time (~15-min cadence).
  - type: cron
    name: yardharvest-facebook-scheduler
    runtime: python
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask publish-due-facebook-posts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yardharvest-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FLASK_APP
        value: wsgi:app
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: yardharvest
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # Schema + seed run once in build.sh (db_upgrade.py then seed_if_empty.py).
    # The start command only boots the server — no duplicate schema pass.
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yardharvest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Distinct from SECRET_KEY so a session-key compromise doesn't yield the
      # JWT key (the code falls back to SECRET_KEY+'-jwt' only if this is unset).
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: NODE_VERSION
        value: 20
      # CRM marketing API token (used by marketing_agent CLI). Leave unset to
      # disable the /crm/api/marketing/* endpoints.
      - key: MARKETING_API_KEY
        sync: false
      # Anthropic key powers the in-CRM "Draft with AI" marketing agent. Unset =
      # the feature is shown but disabled (no drafting). CLAUDE_MODEL is optional.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      # Facebook/Meta CRM integration (publish to Page + Page inbox). Unset =
      # the Integrations → Facebook page shows setup instructions, disabled.
      # See docs/integrations/facebook-setup.md.
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_WEBHOOK_VERIFY_TOKEN
        sync: false
      # Email — Zoho ZeptoMail transactional API (sole provider, send-only token).
      - key: ZEPTOMAIL_TOKEN
        sync: false
      # SMS — Twilio (order/message/garden notifications). All three required;
      # unset = SMS is a no-op (logged only). Per-user opt-in still gates sends.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # Stripe — payments, Connect payouts, subscriptions, webhooks. Without
      # these the app runs in dev-mode (fake "Test Payment" UI, no real money).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # APNs push — see app/push_service.py. Absent = pushes silently skipped.
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      # Public base URL used for Stripe Connect onboarding return/refresh links
      # (e.g. https://yardharvest.com). Falls back to localhost if unset.
      - key: APP_URL
        sync: false
      # Cloudinary object storage for user-uploaded images (CDN; survives
      # deploys). cloudinary://<api_key>:<api_secret>@<cloud_name>. Unset =
      # local-disk uploads (ephemeral on Render).
      - key: CLOUDINARY_URL
        sync: false
      # Sentry error tracking. Paste the project DSN to enable; unset = disabled.
      - key: SENTRY_DSN
        sync: false
