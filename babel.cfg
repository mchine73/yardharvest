# What pybabel scans for translatable strings.
#
#   .venv/Scripts/python.exe -m babel.messages.frontend extract -F babel.cfg -o translations/messages.pot .
#   ... update -i translations/messages.pot -d translations
#   ... compile -d translations
#
# See docs/i18n.md. The frontend has its own catalogs (frontend/src/i18n) —
# this file covers only the Python side: API errors, emails, Jinja templates.
[python: app/**.py]
[jinja2: app/templates/**.html]
