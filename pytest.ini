[pytest]
# Put the repo root on sys.path so `config`, `app`, etc. import under a bare
# `pytest` invocation (CI), not just `python -m pytest` (which adds cwd itself).
pythonpath = .
testpaths = tests marketing_agent/tests
addopts = -q
python_files = test_*.py
python_classes = Test*
python_functions = test_*
