name: android

# Builds the Android app and runs its unit tests and lint whenever the app (or
# this workflow) changes. The debug APK is uploaded so a PR can be sideloaded
# onto a phone without a local toolchain. No secrets: push stays off without
# google-services.json, and debug builds simulate Tap to Pay.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yardharvest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
