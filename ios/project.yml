name: YardHarvest
options:
  bundleIdPrefix: app.yardharvest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios
    from: 23.0.0
  StripeTerminal:
    url: https://github.com/stripe/stripe-terminal-ios
    from: 4.0.0

targets:
  YardHarvest:
    type: application
    platform: iOS
    sources:
      - path: YardHarvest
        excludes:
          - "**/.DS_Store"
          - "Widgets"
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
      - package: StripeTerminal
        product: StripeTerminal
    info:
      path: YardHarvest/Info.plist
      properties:
        CFBundleDisplayName: YardHarvest
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: "Canvas"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: YardHarvest connects to your Phomemo label printer over Bluetooth to print tool QR codes.
        NSCameraUsageDescription: YardHarvest uses the camera to scan tool QR codes and take garden photos.
        NSPhotoLibraryUsageDescription: YardHarvest uses your photo library so you can add existing photos to your garden gallery.
        NSPhotoLibraryAddUsageDescription: YardHarvest saves photos to your photo library when you ask it to.
        NSFaceIDUsageDescription: YardHarvest uses Face ID to quickly and securely unlock your session.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yardharvest.manager
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: B8YCYXF76V
        CODE_SIGN_STYLE: Automatic
        # Tap-to-Pay on iPhone: Apple has approved the Development
        # entitlement for this account, so we now reference the
        # entitlements file (proximity-reader.payment.acceptance = true)
        # and flip the Swift compile flag that gates the runtime path
        # in TerminalManager. Once Apple grants the Distribution
        # entitlement too, App Store / TestFlight Release builds will
        # also sign successfully; until then Debug-on-device works.
        CODE_SIGN_ENTITLEMENTS: YardHarvest/YardHarvest.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: YH_TAP_TO_PAY_ENABLED

  YardHarvestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YardHarvestTests
    dependencies:
      - target: YardHarvest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yardharvest.manager.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  YardHarvest:
    build:
      targets:
        YardHarvest: all
        YardHarvestTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YardHarvestTests
    archive:
      config: Release
