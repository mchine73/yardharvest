databases:
  - name: yardharvest-db
    plan: free
    databaseName: yardharvest

services:
  - type: cron
    name: yardharvest-trial-lifecycle
    runtime: python
    plan: free
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask garden-trial-lifecycle
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yardharvest-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FLASK_APP
        value: wsgi:app

  - type: web
    name: yardharvest
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python seed_if_empty.py && gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yardharvest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: NODE_VERSION
        value: 20
