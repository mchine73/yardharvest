databases:
  - name: yardharvest-db
    plan: free
    databaseName: yardharvest

services:
  - type: cron
    name: yardharvest-trial-lifecycle
    runtime: python
    plan: free
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask garden-trial-lifecycle
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yardharvest-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FLASK_APP
        value: wsgi:app
      # Email providers — the cron sends trial-lifecycle emails. Set at least
      # one (SendGrid primary, ZeptoMail fallback) or emails are logged-only.
      - key: SENDGRID_API_KEY
        sync: false
      - key: ZEPTOMAIL_TOKEN
        sync: false

  - type: web
    name: yardharvest
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python seed_if_empty.py && gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yardharvest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: NODE_VERSION
        value: 20
      # CRM marketing API token (used by marketing_agent CLI). Leave unset to
      # disable the /crm/api/marketing/* endpoints.
      - key: MARKETING_API_KEY
        sync: false
      # Email — SendGrid primary, Zoho ZeptoMail fallback (both API tokens).
      - key: ZEPTOMAIL_TOKEN
        sync: false
      # Stripe — payments, Connect payouts, subscriptions, webhooks. Without
      # these the app runs in dev-mode (fake "Test Payment" UI, no real money).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Public base URL used for Stripe Connect onboarding return/refresh links
      # (e.g. https://yardharvest.com). Falls back to localhost if unset.
      - key: APP_URL
        sync: false
