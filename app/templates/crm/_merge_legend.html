{# expects: merge_fields (list of (token, description)) #}
<div class="yh-card" style="background:var(--brand-pale)">
  <div class="yh-card-body py-2">
    <div class="small fw-semibold text-success mb-1"><i class="bi bi-braces me-1"></i>Merge fields — click to copy</div>
    <div class="d-flex flex-wrap gap-1">
      {% for token, desc in merge_fields %}
      <code class="merge-token" title="{{ desc }}"
            style="cursor:pointer;background:#fff;border:1px solid var(--brand-border);border-radius:6px;padding:1px 6px;font-size:.75rem">{{ token }}</code>
      {% endfor %}
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('.merge-token').forEach(function (el) {
    el.addEventListener('click', function () {
      navigator.clipboard && navigator.clipboard.writeText(el.textContent);
      const old = el.style.background; el.style.background = '#C8E6D4';
      setTimeout(function(){ el.style.background = old; }, 400);
    });
  });
</script>
