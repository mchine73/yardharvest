name: Migrate CRM data

# One-off, manual migration of the standalone yardharvest-crm-db into the
# consolidated yardharvest-db (renaming tables to crm_*). Run from the Actions
# tab (or `gh workflow run "Migrate CRM data"`). DB URLs are read from repo
# secrets so they never appear on a command line or in this repo.
#
# Required repo secrets:
#   CRM_SOURCE_DB_URL  - External connection string for the old yardharvest-crm-db
#   CRM_TARGET_DB_URL  - External connection string for yardharvest-db
#
# Safety: defaults to a DRY RUN (writes nothing). To actually migrate, set the
# "mode" input to "execute".

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default, writes nothing) or execute (commits the migration)"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - execute
      bootstrap_schema:
        description: "Create the crm_* tables on the target first (safe/idempotent; needed if you migrate before deploying)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: crm-data-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap crm_* tables on target (idempotent)
        if: ${{ inputs.bootstrap_schema }}
        env:
          # Pointing the app at the target DB and booting it runs db.create_all(),
          # which only CREATES missing tables (never alters existing ones).
          DATABASE_URL: ${{ secrets.CRM_TARGET_DB_URL }}
          # create_app() reads Config, which hard-exits in "production" (DATABASE_URL
          # set) without a SECRET_KEY. Any value works for a schema-only boot.
          SECRET_KEY: migration-bootstrap-not-a-real-secret
        run: |
          python -c "from app import create_app; create_app(); print('crm_* tables ensured on target')"

      - name: Dry run (no writes)
        if: ${{ inputs.mode == 'dry-run' }}
        env:
          CRM_SOURCE_DB_URL: ${{ secrets.CRM_SOURCE_DB_URL }}
          CRM_TARGET_DB_URL: ${{ secrets.CRM_TARGET_DB_URL }}
        run: python scripts/migrate_crm_data.py

      - name: Execute migration (commits)
        if: ${{ inputs.mode == 'execute' }}
        env:
          CRM_SOURCE_DB_URL: ${{ secrets.CRM_SOURCE_DB_URL }}
          CRM_TARGET_DB_URL: ${{ secrets.CRM_TARGET_DB_URL }}
        run: python scripts/migrate_crm_data.py --execute
